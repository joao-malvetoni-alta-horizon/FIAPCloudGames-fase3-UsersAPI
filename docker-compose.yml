# Infraestrutura local para desenvolvimento da UsersAPI.
# Sobe PostgreSQL e RabbitMQ; a API roda localmente com `dotnet run`
# (ambiente Development -> aponta para localhost).
#
# Obs.: a API ainda não é construída aqui porque, na opção A, ela referencia o
# projeto de contratos (FiapCloudGames.Contracts) fora deste repositório, fora do
# contexto do `docker build`. Quando o pacote estiver no nuget.org e trocarmos para
# PackageReference, basta adicionar o serviço "api" usando o Dockerfile existente.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fcgdb
      POSTGRES_USER: fcg
      POSTGRES_PASSWORD: fcg123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg -d fcgdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Topologia (usuário fcg, vhost e exchange) provisionada no boot via
    # definitions.json — não há env RABBITMQ_DEFAULT_USER porque, com
    # load_definitions ativo, o broker ignora o usuário default.
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (http://localhost:15672 - fcg/fcg123)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
