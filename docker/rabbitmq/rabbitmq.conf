# Carrega a topologia (usuário, vhost e exchange) no boot do broker, de forma
# idempotente. Assim o `docker compose up` já deixa o RabbitMQ pronto: a exchange
# `users.exchange` (topic) existe antes de qualquer publicação, sem nenhum passo
# manual. Cada consumidor é responsável por declarar sua própria fila/binding
# (ex.: NotificationsAPI cria `notifications.user-registered` ligada a
# `user.registered`) — não há mais uma fila catch-all pré-provisionada aqui.
#
# Obs.: com load_definitions ativo, o RabbitMQ NÃO cria o usuário do
# RABBITMQ_DEFAULT_USER/PASS — por isso o usuário `fcg` vem definido (com
# password_hash) dentro do próprio definitions.json.
load_definitions = /etc/rabbitmq/definitions.json
